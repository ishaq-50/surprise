<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For You, My Love</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom right, #ffe0e9, #ffc8dd);
      color: #3a3a3a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      text-align: center;
    }
    h1 {
      font-size: 2.8rem;
      color: #d6336c;
    }
    p {
      font-size: 1.3rem;
      margin: 20px;
      max-width: 600px;
    }
    .secret {
      margin-top: 40px;
      font-size: 1rem;
      color: #555;
      cursor: pointer;
    }
    .hidden-message {
      display: none;
      margin-top: 20px;
      font-size: 1.2rem;
      color: #6a097d;
      font-weight: bold;
    }
    .secret:hover + .hidden-message {
      display: block;
    }
    audio {
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <h1>Hey [Her Name] 💖</h1>
  <p>
    This little corner of the internet is just for you.  
    You make my world brighter, my heart fuller, and my days sweeter.  
    I just wanted to say... I love you, endlessly. 💌
  </p>
  <div class="secret">👉 Tap here for a secret...</div>
  <div class="hidden-message">You’re the best thing that ever happened to me ❤️</div>
  <audio controls autoplay>
    <source src="your-music-link.mp3" type="audio/mpeg">
    Your browser does not support the audio tag.
  </audio>
</body>
</html>
